<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps User Lookup</title>
  <style>
    body {
      width: 350px;
      min-height: 200px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      font-size: 14px;
      line-height: 1.4;
      background-color: #ffffff;
      color: #333333;
      margin: 0;
    }
    
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e1e4e8;
    }
    
    .header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      color: #24292e;
    }
    
    .search-container {
      margin-bottom: 16px;
    }
    
    .input-group {
      margin-bottom: 12px;
    }
    
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
      color: #586069;
    }
    
    input[type="text"], select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d5da;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
      transition: border-color 0.15s ease-in-out;
    }
    
    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: #0366d6;
      box-shadow: 0 0 0 3px rgba(3, 102, 214, 0.15);
    }
    
    button {
      width: 100%;
      padding: 8px 16px;
      background-color: #0366d6;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease-in-out;
    }
    
    button:hover {
      background-color: #0256cc;
    }
    
    button:active {
      background-color: #044289;
    }
    
    button:disabled {
      background-color: #6a737d;
      cursor: not-allowed;
    }
    
    .results {
      margin-top: 16px;
      max-height: 200px;
      overflow-y: auto;
    }
    
    .user-item {
      padding: 8px 12px;
      border: 1px solid #e1e4e8;
      border-radius: 4px;
      margin-bottom: 8px;
      background-color: #f6f8fa;
      cursor: pointer;
      transition: background-color 0.15s ease-in-out;
    }
    
    .user-item:hover {
      background-color: #e1e5e9;
    }
    
    .user-name {
      font-weight: 500;
      color: #24292e;
    }
    
    .user-email {
      font-size: 12px;
      color: #586069;
      margin-top: 2px;
    }
    
    .no-results {
      text-align: center;
      color: #586069;
      font-style: italic;
      padding: 16px;
    }
    
    .error {
      background-color: #ffeef0;
      border: 1px solid #fdaeb7;
      color: #86181d;
      padding: 8px;
      border-radius: 4px;
      font-size: 13px;
    }
    
    .loading {
      text-align: center;
      padding: 16px;
      color: #586069;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>DevOps User Lookup</h1>
  </div>
  
  <div class="search-container">
    <div class="input-group">
      <label for="search-query">Search for users:</label>
      <input type="text" id="search-query" placeholder="Enter name or email..." />
    </div>
    
    <div class="input-group">
      <label for="search-scope">Search scope:</label>
      <select id="search-scope">
        <option value="project">Project first, then organization</option>
        <option value="org">Organization only</option>
      </select>
    </div>
    
    <button id="search-button">Search Users</button>
  </div>
  
  <div id="results" class="results"></div>
  
  <script src="dist/popup.js"></script>
</body>
</html>
